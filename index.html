<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
            50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.8); }
        }
        .cell-animate { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .win-glow { box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); }
        .bg-gradient-dark { background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body class="bg-gradient-dark min-h-screen flex items-center justify-center p-4 text-white">

    <div class="w-full max-w-sm bg-slate-900/50 backdrop-blur-xl border border-slate-700 rounded-3xl shadow-2xl p-6">
        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400 text-center mb-6">Tic Tac Toe</h1>
        
        <div class="flex justify-between mb-6 bg-slate-800/50 p-3 rounded-2xl border border-slate-700">
            <div class="text-center">
                <p class="text-xs text-slate-400 uppercase font-bold">Player X</p>
                <p id="scoreX" class="text-xl font-bold">0</p>
            </div>
            <div class="text-center">
                <p class="text-xs text-slate-400 uppercase font-bold">Draws</p>
                <p id="scoreDraws" class="text-xl font-bold">0</p>
            </div>
            <div class="text-center">
                <p class="text-xs text-slate-400 uppercase font-bold">Player O</p>
                <p id="scoreO" class="text-xl font-bold">0</p>
            </div>
        </div>

        <div id="status" class="text-center font-medium text-lg text-slate-200 mb-6 py-2 px-4 rounded-full bg-slate-800 border border-slate-700 transition-all duration-300">
            Player X's Turn
        </div>

        <div id="board" class="grid grid-cols-3 gap-3 mb-8">
            <!-- Grid cells generated by JS -->
        </div>

        <!-- Action buttons -->
        <div class="grid grid-cols-2 gap-3">
            <button id="resetBtn" class="py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl transition-all active:scale-95 shadow-[0_0_20px_-5px_rgba(79,70,229,0.5)]">
                Reset Board
            </button>
            <button id="resetStatsBtn" class="py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-2xl transition-all active:scale-95 border border-slate-600">
                Reset Scores
            </button>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const resetStatsBtn = document.getElementById('resetStatsBtn');
        
        let board = Array(9).fill(null);
        let currentPlayer = 'X';
        let gameActive = true;
        let scores = { X: 0, O: 0, draws: 0 };

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function updateScores() {
            document.getElementById('scoreX').textContent = scores.X;
            document.getElementById('scoreO').textContent = scores.O;
            document.getElementById('scoreDraws').textContent = scores.draws;
        }

        function createBoard() {
            boardElement.innerHTML = '';
            board.forEach((cell, index) => {
                const div = document.createElement('div');
                div.className = "h-24 bg-slate-800 rounded-2xl flex items-center justify-center text-4xl font-black cursor-pointer hover:bg-slate-700 transition-all border border-slate-600 hover:border-indigo-500";
                div.addEventListener('click', () => handleCellClick(index));
                if (cell) {
                    div.textContent = cell;
                    div.classList.add(cell === 'X' ? 'text-indigo-400' : 'text-purple-400', 'cell-animate');
                }
                boardElement.appendChild(div);
            });
        }

        function handleCellClick(index) {
            if (!gameActive || board[index]) return;

            board[index] = currentPlayer;
            checkResult();
            if (gameActive) {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                statusElement.textContent = `Player ${currentPlayer}'s Turn`;
            }
            createBoard();
        }

        function checkResult() {
            let roundWon = false;
            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusElement.textContent = `Player ${currentPlayer} Wins! 🎉`;
                statusElement.className = "text-center font-bold text-lg text-white mb-6 win-glow py-2 px-4 rounded-full bg-indigo-600";
                gameActive = false;
                scores[currentPlayer]++;
                updateScores();
                return;
            }

            if (!board.includes(null)) {
                statusElement.textContent = "It's a Draw! 🤝";
                scores.draws++;
                updateScores();
                gameActive = false;
            }
        }

        resetBtn.addEventListener('click', () => {
            board = Array(9).fill(null);
            currentPlayer = 'X';
            gameActive = true;
            statusElement.textContent = "Player X's Turn";
            statusElement.className = "text-center font-medium text-lg text-slate-200 mb-6 py-2 px-4 rounded-full bg-slate-800 border border-slate-700 transition-all duration-300";
            createBoard();
        });

        resetStatsBtn.addEventListener('click', () => {
            scores = { X: 0, O: 0, draws: 0 };
            updateScores();
        });

        // Initial build
        createBoard();
        updateScores();
    </script>
</body>
</html>
